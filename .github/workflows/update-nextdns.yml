name: Update NextDNS denylist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  update-denylist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nextdnsctl
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nextdnsctl package
        run: python -m pip install nextdnsctl

      - name: Update denylist
        env:
          NEXTDNS_ACCOUNT_1_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_1_API_KEY }}
          NEXTDNS_PROFILE_ID: ${{ secrets.NEXTDNS_PROFILE_ID }}
        shell: bash
        run: |
          set -e

          LISTS_FILE="blocklists.txt"
          [ -f "$LISTS_FILE" ] || { echo "::error::Blocklists file not found"; exit 1; }

          export NEXTDNS_API_KEY="$NEXTDNS_ACCOUNT_1_API_KEY"
          export NEXTDNS_PROFILE="$NEXTDNS_PROFILE_ID"

          [ -n "$NEXTDNS_API_KEY" ] || { echo "::error::NEXTDNS_ACCOUNT_1_API_KEY secret is not configured"; exit 1; }
          [ -n "$NEXTDNS_PROFILE" ] || { echo "::error::NEXTDNS_PROFILE_ID secret is not configured"; exit 1; }

          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT

          COMBINED_RAW="$TEMP_DIR/blocklist_combined_raw.txt"
          touch "$COMBINED_RAW"

          while IFS= read -r url || [ -n "$url" ]; do
            url=$(echo "$url" | sed 's/[[:space:]]*$//' | sed 's/^[[:space:]]*//')
            [ -z "$url" ] && continue
            case "$url" in \#*) continue;; esac
            curl -sfL "$url" -o "$TEMP_DIR/tmp.txt"
            cat "$TEMP_DIR/tmp.txt" >> "$COMBINED_RAW"
          done < "$LISTS_FILE"

          CLEAN_FILE="$TEMP_DIR/clean.txt"
          sed 's/#.*//' "$COMBINED_RAW" \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | sort -u > "$CLEAN_FILE"

          echo "Exporting current denylist..."
          nextdnsctl denylist export > "$TEMP_DIR/current.txt" 2>&1 || {
            echo "::error::Failed to export denylist"
            cat "$TEMP_DIR/current.txt"
            exit 1
          }

          echo "Importing blocklist..."
          nextdnsctl denylist import "$CLEAN_FILE"
